<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Task7</title>
</head>
<body>
    <h1>Изменение свойств линии</h1>
    <hr id="myHr">

    <form id="hrForm">
        <fieldset>
            <legend>Выравнивание</legend>
            <label><input type="radio" name="align" value="left" checked> LEFT</label>
            <label><input type="radio" name="align" value="center"> CENTER</label>
            <label><input type="radio" name="align" value="right"> RIGHT</label>
        </fieldset>

        <div>
            <label>Толщина линии (size):
                <input type="number" id="sizeInput" value="25">
            </label>
        </div>

        <div>
            <label>Длина линии (width):
                <input type="number" id="widthInput" value="270">
            </label>
        </div>

        <div>
            <label>Цвет линии (color):
                <select id="colorSelect">
                    <option value="teal" selected>teal</option>
                    <option value="green">green</option>
                    <option value="olive">olive</option>
                    <option value="navy">navy</option>
                    <option value="purple">purple</option>
                    <option value="gray">gray</option>
                    <option value="silver">silver</option>
                    <option value="yellow">yellow</option>
                    <option value="blue">blue</option>
                    <option value="fuchsia">fuchsia</option>
                    <option value="white">white</option>
                </select>
            </label>
        </div>

        <div>
            <button type="button" id="applyBtn">Выполнить</button>
            <button type="reset">Обновить</button>
        </div>
    </form>

    <script>
        var myHr = document.getElementById('myHr');
        var hrForm = document.getElementById('hrForm');
        var sizeInput = document.getElementById('sizeInput');
        var widthInput = document.getElementById('widthInput');
        var colorSelect = document.getElementById('colorSelect');
        var applyBtn = document.getElementById('applyBtn');

        applyBtn.addEventListener('click', function () {
            var alignValue = hrForm.elements['align'].value;
            myHr.align = alignValue;
            myHr.size = sizeInput.value;
            myHr.width = widthInput.value;
            myHr.color = colorSelect.value;
        });

        hrForm.addEventListener('reset', function () {
            setTimeout(function () {
                myHr.align = 'left';
                myHr.size = 25;
                myHr.width = 270;
                myHr.color = 'teal';
            }, 0);
        });
    </script>
</body>
</html>
