<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Task2</title>
</head>
<body>
    <button id="btn">Нажми, чтобы скрыть</button>

    <script>
        var btn = document.getElementById('btn');

        btn.addEventListener('click', function () {
            btn.style.display = 'none';
        });
    </script>
